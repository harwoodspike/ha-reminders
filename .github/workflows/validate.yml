name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly — catches new hassfest / HACS requirements even without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Remove once brand icons are added to home-assistant/brands.
          ignore: brands
